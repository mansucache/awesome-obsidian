name: Periodic resource review
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare source URLs and editorial queue
        run: |
          python3 scripts/catalog.py sources > /tmp/catalog-sources.txt
          python3 scripts/catalog.py report >> "$GITHUB_STEP_SUMMARY"
      - name: Check public sources
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --timeout 20 --max-retries 2 --max-concurrency 4 --exclude-private /tmp/catalog-sources.txt
          fail: false
          failIfEmpty: true
          jobSummary: true
          output: /tmp/resource-links.md
      - name: Explain review policy
        if: always()
        run: |
          echo 'Link errors are review signals. Recheck 403/429/timeouts; confirm redirects and 404/410 before editing. No resources were automatically removed.' >> "$GITHUB_STEP_SUMMARY"
